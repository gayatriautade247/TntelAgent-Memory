<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IntelAgent — AI Intelligence Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   IntelAgent — Design tokens
   ========================================================================== */
:root{
  --bg:#0B0F14;
  --bg-grid: rgba(62,214,196,0.035);
  --surface:#121820;
  --surface-2:#182028;
  --surface-3:#1D2630;
  --border:#232D38;
  --border-light:#2C3844;
  --text:#E8EDF2;
  --text-dim:#8E9BAA;
  --text-faint:#5A6674;

  --accent:#3ED6C4;      /* signal cyan */
  --accent-dim:rgba(62,214,196,0.14);
  --accent-line:rgba(62,214,196,0.35);

  --amber:#F5A623;
  --amber-dim:rgba(245,166,35,0.14);
  --red:#F0637C;
  --red-dim:rgba(240,99,124,0.14);
  --blue:#5B9DFF;
  --blue-dim:rgba(91,157,255,0.14);
  --purple:#9B8CFF;
  --purple-dim:rgba(155,140,255,0.14);
  --green:#4CD787;
  --green-dim:rgba(76,215,135,0.14);

  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;

  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(62,214,196,0.06), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(155,140,255,0.05), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}

a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--accent-dim); color:var(--accent);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
p{margin:0;}

.mono{font-family:var(--font-mono);}

/* ==========================================================================
   Layout shell
   ========================================================================== */
#app{min-height:100vh; display:flex; flex-direction:column;}

.container{
  width:100%;
  max-width:1180px;
  margin:0 auto;
  padding:0 28px;
}
@media (max-width:640px){ .container{padding:0 18px;} }

/* ---- Top nav ---- */
.topnav{
  position:sticky; top:0; z-index:50;
  background:rgba(11,15,20,0.86);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topnav-inner{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 0;
}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer; border:none; background:none; color:inherit; padding:0;}
.brand-mark{width:30px;height:30px;flex:0 0 auto;}
.brand-text{display:flex; flex-direction:column; line-height:1.05;}
.brand-name{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-0.01em;}
.brand-tag{font-family:var(--font-mono); font-size:10px; color:var(--accent); letter-spacing:0.14em; text-transform:uppercase;}

.nav-links{display:flex; align-items:center; gap:26px;}
.nav-link{
  font-size:14px; color:var(--text-dim); background:none; border:none; padding:6px 0;
  border-bottom:2px solid transparent;
}
.nav-link:hover{color:var(--text);}
.nav-link.active{color:var(--text); border-bottom-color:var(--accent);}

.nav-right{display:flex; align-items:center; gap:14px;}
.icon-btn{
  width:36px; height:36px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center;
  transition:border-color .15s ease, color .15s ease;
}
.icon-btn:hover{border-color:var(--border-light); color:var(--text);}

.avatar{
  width:36px; height:36px; border-radius:10px;
  background:linear-gradient(135deg, var(--accent), var(--purple));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:13px; color:#08110F;
  border:none;
}

@media (max-width:820px){
  .nav-links{display:none;}
}

/* ==========================================================================
   Buttons
   ========================================================================== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--font-body); font-weight:600; font-size:14px;
  padding:12px 20px; border-radius:10px; border:1px solid transparent;
  transition:transform .12s ease, border-color .15s ease, background .15s ease, opacity .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{
  background:var(--accent); color:#06110E;
}
.btn-primary:hover{background:#4EE2D0;}
.btn-primary:disabled{opacity:0.55; cursor:not-allowed;}
.btn-secondary{
  background:var(--surface-2); color:var(--text); border-color:var(--border-light);
}
.btn-secondary:hover{border-color:var(--accent-line); color:var(--accent);}
.btn-ghost{
  background:transparent; color:var(--text-dim); border-color:var(--border);
}
.btn-ghost:hover{color:var(--text); border-color:var(--border-light);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:8px;}

/* ==========================================================================
   Hero
   ========================================================================== */
.hero{
  padding:64px 0 44px;
  border-bottom:1px solid var(--border);
  position:relative;
  overflow:hidden;
}
.hero-eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.10em; text-transform:uppercase;
  color:var(--accent); background:var(--accent-dim);
  border:1px solid var(--accent-line);
  padding:6px 12px; border-radius:999px; margin-bottom:22px;
}
.pulse-dot{
  width:7px; height:7px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 0 0 rgba(62,214,196,0.6);
  animation:pulse 2.2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(62,214,196,0.45);}
  70%{box-shadow:0 0 0 8px rgba(62,214,196,0);}
  100%{box-shadow:0 0 0 0 rgba(62,214,196,0);}
}
.hero-grid{display:grid; grid-template-columns:1.15fr 0.85fr; gap:40px; align-items:center;}
@media (max-width:900px){ .hero-grid{grid-template-columns:1fr;} }

.hero h1{font-size:44px; line-height:1.08; font-weight:700; max-width:600px;}
.hero .accent-word{color:var(--accent);}
.hero-sub{margin-top:16px; color:var(--text-dim); font-size:16px; max-width:520px; line-height:1.6;}
@media (max-width:640px){ .hero h1{font-size:32px;} }

.radar-wrap{
  position:relative; width:100%; aspect-ratio:1/1; max-width:340px; margin:0 auto;
  display:flex; align-items:center; justify-content:center;
}
.radar-ring{
  position:absolute; border:1px solid rgba(62,214,196,0.18); border-radius:50%;
}
.radar-sweep{
  position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg, rgba(62,214,196,0.32), transparent 32%);
  animation:spin 5s linear infinite;
  mask-image:radial-gradient(circle, black 60%, transparent 100%);
}
@keyframes spin{to{transform:rotate(360deg);}}
.radar-blip{
  position:absolute; width:6px; height:6px; border-radius:50%; background:var(--amber);
  box-shadow:0 0 8px var(--amber);
}
.radar-core{
  width:12px; height:12px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 14px var(--accent); z-index:2;
}

/* ==========================================================================
   Section headings
   ========================================================================== */
.section{padding:48px 0;}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:24px; flex-wrap:wrap;}
.section-eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px;}
.section-title{font-size:24px; font-weight:700;}
.section-desc{color:var(--text-dim); font-size:14.5px; margin-top:6px; max-width:520px;}

/* ==========================================================================
   Category cards
   ========================================================================== */
.cat-grid{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:18px;
}
@media (max-width:900px){ .cat-grid{grid-template-columns:repeat(2, 1fr);} }
@media (max-width:600px){ .cat-grid{grid-template-columns:1fr;} }

.cat-card{
  --c: var(--accent);
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:24px;
  text-align:left;
  display:flex; flex-direction:column; gap:14px;
  transition:border-color .15s ease, transform .15s ease, background .15s ease;
  overflow:hidden;
}
.cat-card::before{
  content:"";
  position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--c);
  opacity:0.9;
}
.cat-card:hover{
  border-color:var(--border-light);
  transform:translateY(-2px);
  background:var(--surface-2);
}
.cat-icon{
  width:44px; height:44px; border-radius:12px;
  background:color-mix(in srgb, var(--c) 16%, transparent);
  display:flex; align-items:center; justify-content:center;
  font-size:21px;
}
.cat-name{font-family:var(--font-display); font-size:17px; font-weight:700;}
.cat-desc{color:var(--text-dim); font-size:13.5px; line-height:1.5;}
.cat-foot{
  margin-top:auto; display:flex; align-items:center; justify-content:space-between;
  font-family:var(--font-mono); font-size:11px; color:var(--text-faint); letter-spacing:0.04em;
}
.cat-arrow{color:var(--c); font-size:16px; transition:transform .15s ease;}
.cat-card:hover .cat-arrow{transform:translateX(3px);}

/* ==========================================================================
   Quick-monitor search box (home)
   ========================================================================== */
.quickbox{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:26px;
  display:flex; gap:12px; align-items:center; flex-wrap:wrap;
}
.quickbox-field{flex:1 1 320px; min-width:0;}
.quickbox label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:8px; font-weight:500;}
.input{
  width:100%;
  background:var(--surface-3); border:1px solid var(--border-light); color:var(--text);
  border-radius:10px; padding:13px 14px; font-size:14.5px; font-family:var(--font-body);
}
.input::placeholder{color:var(--text-faint);}
.input:focus{border-color:var(--accent);}
.select{
  background:var(--surface-3); border:1px solid var(--border-light); color:var(--text);
  border-radius:10px; padding:13px 14px; font-size:14.5px; font-family:var(--font-body);
  min-width:200px;
}

/* ==========================================================================
   Stat strip
   ========================================================================== */
.stat-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:36px;}
@media (max-width:760px){ .stat-strip{grid-template-columns:repeat(2,1fr);} }
.stat{
  border:1px solid var(--border); border-radius:var(--radius-md); padding:18px;
  background:var(--surface);
}
.stat-num{font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--accent);}
.stat-label{font-size:12px; color:var(--text-dim); margin-top:4px;}

/* ==========================================================================
   Topic select page
   ========================================================================== */
.back-link{
  display:inline-flex; align-items:center; gap:6px; color:var(--text-dim); font-size:13.5px;
  background:none; border:none; padding:0; margin-bottom:22px;
}
.back-link:hover{color:var(--accent);}

.topic-head{display:flex; align-items:center; gap:16px; margin-bottom:8px;}
.topic-icon{
  width:52px;height:52px;border-radius:14px;
  background:var(--c-dim); display:flex; align-items:center; justify-content:center; font-size:24px;
  border:1px solid var(--c-line);
}
.topic-panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:30px; margin-top:26px;
}
.topic-label{font-size:13px; color:var(--text-dim); margin-bottom:10px; font-weight:500;}
.chip-row{display:flex; flex-wrap:wrap; gap:9px; margin-bottom:22px;}
.chip{
  font-family:var(--font-mono); font-size:12.5px; color:var(--text-dim);
  background:var(--surface-3); border:1px solid var(--border-light);
  padding:8px 13px; border-radius:999px; transition:all .12s ease;
}
.chip:hover{color:var(--accent); border-color:var(--accent-line); background:var(--accent-dim);}
.chip.selected{color:#06110E; background:var(--accent); border-color:var(--accent);}

.topic-actions{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;}

/* ==========================================================================
   Intelligence Dashboard
   ========================================================================== */
.dash-header{
  border-bottom:1px solid var(--border);
  padding:30px 0;
}
.dash-header-row{display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;}
.dash-title-row{display:flex; align-items:center; gap:14px;}
.dash-badge{
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
  padding:5px 11px; border-radius:999px; border:1px solid var(--c-line); color:var(--c); background:var(--c-dim);
}
.dash-title{font-size:26px; font-weight:700;}
.dash-meta{display:flex; gap:18px; margin-top:10px; flex-wrap:wrap;}
.dash-meta-item{font-family:var(--font-mono); font-size:12px; color:var(--text-faint); display:flex; align-items:center; gap:6px;}

.dash-actions{display:flex; gap:10px;}

.tabs{display:flex; gap:6px; overflow-x:auto; margin-top:22px; padding-bottom:4px;}
.tab{
  font-size:13px; color:var(--text-dim); background:var(--surface); border:1px solid var(--border);
  padding:9px 15px; border-radius:999px; white-space:nowrap; flex:0 0 auto;
}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent); border-color:var(--accent-line); background:var(--accent-dim);}

/* ---- update cards ---- */
.update-list{display:flex; flex-direction:column; gap:12px;}
.update-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:18px 20px; display:flex; gap:16px; align-items:flex-start;
}
.imp-bars{display:flex; flex-direction:column; gap:3px; padding-top:3px;}
.imp-bar{width:4px; height:8px; border-radius:2px; background:var(--border-light);}
.imp-bar.on{background:var(--bar-color);}
.update-body{flex:1; min-width:0;}
.update-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
.tag{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase;
  padding:3px 9px; border-radius:999px; border:1px solid var(--border-light); color:var(--text-dim);
}
.tag.imp{font-weight:600;}
.tag.imp.Critical{color:var(--red); border-color:rgba(240,99,124,0.4); background:var(--red-dim);}
.tag.imp.High{color:var(--amber); border-color:rgba(245,166,35,0.4); background:var(--amber-dim);}
.tag.imp.Medium{color:var(--blue); border-color:rgba(91,157,255,0.4); background:var(--blue-dim);}
.tag.imp.Low{color:var(--text-dim);}
.update-title{font-size:15px; font-weight:600; margin-bottom:5px; line-height:1.4;}
.update-summary{font-size:13.5px; color:var(--text-dim); line-height:1.55;}
.update-source-row{margin-top:9px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint);}

/* ---- panel / card generic ---- */
.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px;
}
.panel-title{display:flex; align-items:center; gap:10px; font-size:16px; font-weight:700; margin-bottom:16px;}
.panel-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:6px;}
@media (max-width:900px){ .panel-grid{grid-template-columns:1fr;} }

.trend-item{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.trend-item:last-child{border-bottom:none;}
.trend-name{font-size:13.5px; color:var(--text);}
.trend-bar-track{flex:1; max-width:120px; height:6px; border-radius:4px; background:var(--surface-3); margin:0 12px; overflow:hidden;}
.trend-bar-fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--purple));}
.trend-val{font-family:var(--font-mono); font-size:12px; color:var(--accent); width:36px; text-align:right;}

/* ---- quick AI insight card ---- */
.insight-card{
  background:linear-gradient(160deg, rgba(62,214,196,0.07), rgba(155,140,255,0.04));
  border:1px solid var(--accent-line); border-radius:var(--radius-lg); padding:26px;
}
.insight-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:16px;}
@media (max-width:900px){ .insight-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:560px){ .insight-grid{grid-template-columns:1fr;} }
.insight-block-label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;}
.insight-block-text{font-size:13.5px; color:var(--text); line-height:1.55;}

/* ---- recommended actions list ---- */
.action-list{display:flex; flex-direction:column; gap:10px;}
.action-row{
  display:flex; align-items:flex-start; gap:12px; padding:13px 14px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
}
.action-num{
  font-family:var(--font-mono); font-size:11px; color:var(--accent); background:var(--accent-dim);
  width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.action-text{font-size:13.5px; color:var(--text); line-height:1.5;}

/* ==========================================================================
   AI Intelligence Report (multi-agent)
   ========================================================================== */
.ai-report-shell{
  border:1px solid var(--accent-line);
  border-radius:var(--radius-lg);
  background:
    linear-gradient(160deg, rgba(62,214,196,0.09), rgba(11,15,20,0)) ,
    var(--surface);
  padding:0; overflow:hidden;
  margin-top:10px;
}
.ai-report-top{
  padding:24px 26px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  border-bottom:1px solid var(--border);
}
.ai-report-heading{display:flex; align-items:center; gap:12px;}
.ai-badge{
  width:40px;height:40px;border-radius:11px;
  background:linear-gradient(135deg, var(--accent), var(--purple));
  display:flex; align-items:center; justify-content:center; font-size:18px;
}
.ai-report-title{font-size:17px; font-weight:700;}
.ai-report-sub{font-size:12.5px; color:var(--text-dim); margin-top:2px;}

.ai-body{padding:26px;}

.agent-log{
  font-family:var(--font-mono); font-size:12.5px; line-height:2.0;
  background:#0A0E13; border:1px solid var(--border); border-radius:10px;
  padding:16px 18px; color:var(--text-dim); min-height:60px;
}
.agent-log .line{opacity:0; animation:fadein .4s ease forwards;}
.agent-log .line.agent1{color:var(--purple);}
.agent-log .line.agent2{color:var(--blue);}
.agent-log .line.sys{color:var(--accent);}
.agent-log .caret{display:inline-block; width:7px; height:13px; background:var(--accent); margin-left:2px; animation:blink 1s step-end infinite; vertical-align:middle;}
@keyframes fadein{to{opacity:1;}}
@keyframes blink{50%{opacity:0;}}

.report-section{margin-top:26px;}
.report-section:first-child{margin-top:0;}
.report-label{
  display:flex; align-items:center; gap:9px;
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--text-faint); margin-bottom:10px;
}
.report-label .n{color:var(--accent);}
.report-text{font-size:14.5px; line-height:1.7; color:var(--text);}
.bullet-list{display:flex; flex-direction:column; gap:9px;}
.bullet-row{display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.6; color:var(--text);}
.bullet-dot{width:5px;height:5px;border-radius:50%; background:var(--accent); margin-top:8px; flex:0 0 auto;}

.impact-pill{
  display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px;
  font-family:var(--font-mono); font-weight:600; font-size:13px; letter-spacing:0.03em;
  border:1px solid; margin-bottom:12px;
}
.impact-pill.Low{color:var(--text-dim); border-color:var(--border-light); background:var(--surface-2);}
.impact-pill.Medium{color:var(--blue); border-color:rgba(91,157,255,0.4); background:var(--blue-dim);}
.impact-pill.High{color:var(--amber); border-color:rgba(245,166,35,0.4); background:var(--amber-dim);}
.impact-pill.Critical{color:var(--red); border-color:rgba(240,99,124,0.4); background:var(--red-dim);}

.org-grid{display:flex; flex-wrap:wrap; gap:10px;}
.org-chip{
  background:var(--surface-2); border:1px solid var(--border-light); border-radius:10px; padding:10px 14px;
  font-size:13px; min-width:180px; flex:1 1 200px;
}
.org-chip b{display:block; font-size:13.5px; margin-bottom:3px; color:var(--text);}
.org-chip span{font-size:12px; color:var(--text-dim); line-height:1.4;}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
@media (max-width:800px){ .two-col{grid-template-columns:1fr;} }

.opp-box, .risk-box{
  border-radius:12px; padding:18px; border:1px solid;
}
.opp-box{background:var(--green-dim); border-color:rgba(76,215,135,0.35);}
.risk-box{background:var(--red-dim); border-color:rgba(240,99,124,0.35);}
.opp-box .report-label, .risk-box .report-label{color:inherit; opacity:0.85;}
.opp-box{color:#BFF3D6;}
.risk-box{color:#FBC9D3;}

.why-care-box{
  background:var(--accent-dim); border:1px solid var(--accent-line); border-radius:12px; padding:18px;
  font-size:14.5px; line-height:1.65;
}

.forecast-box{
  background:var(--surface-2); border:1px dashed var(--border-light); border-radius:12px; padding:18px;
}
.forecast-flag{
  font-family:var(--font-mono); font-size:10.5px; color:var(--purple); background:var(--purple-dim);
  border:1px solid rgba(155,140,255,0.4); padding:4px 10px; border-radius:999px; display:inline-block; margin-bottom:12px;
}

.ai-empty{
  padding:50px 26px; text-align:center;
}
.ai-empty-icon{font-size:34px; margin-bottom:14px;}
.ai-empty-title{font-size:16px; font-weight:700; margin-bottom:8px;}
.ai-empty-sub{font-size:13.5px; color:var(--text-dim); max-width:440px; margin:0 auto 22px;}

.toast{
  position:fixed; bottom:22px; right:22px; z-index:100;
  background:var(--surface-2); border:1px solid var(--border-light); border-radius:10px;
  padding:13px 18px; font-size:13.5px; display:flex; align-items:center; gap:10px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
  animation:toastin .2s ease;
}
.toast.success{border-color:rgba(76,215,135,0.4);}
.toast.error{border-color:rgba(240,99,124,0.4);}
@keyframes toastin{from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;}}

/* ==========================================================================
   Footer
   ========================================================================== */
.footer{border-top:1px solid var(--border); padding:26px 0; margin-top:auto;}
.footer-inner{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
.footer-text{font-size:12.5px; color:var(--text-faint);}

/* small utility */
.flex{display:flex;}
.gap8{gap:8px;}
.grow{flex:1;}
.hidden{display:none !important;}

/* ==========================================================================
   Context & Memory layer
   ========================================================================== */
.memory-shell{max-width:980px;margin:0 auto;}
.memory-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:800px){.memory-grid{grid-template-columns:1fr;}}
.memory-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;}
.memory-context{background:var(--surface-3);border:1px solid var(--border-light);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;}
.memory-context-row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);padding-bottom:10px;}
.memory-context-row:last-child{border-bottom:none;padding-bottom:0;}
.memory-key{font-family:var(--font-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;}
.memory-value{font-size:13.5px;color:var(--text);text-align:right;word-break:break-word;}
.memory-input-row{display:flex;gap:10px;align-items:center;}
.memory-input-row .input{flex:1;}
.memory-list{display:flex;flex-direction:column;gap:9px;max-height:320px;overflow:auto;}
.memory-item{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;padding:12px 14px;}
.memory-item-text{font-size:13.5px;line-height:1.5;color:var(--text);}
.memory-item-time{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-top:5px;}
.memory-empty{font-size:13px;color:var(--text-faint);padding:10px 0;}
.memory-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.memory-badge{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-line);padding:4px 9px;border-radius:999px;}

</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================================
   IntelAgent — demo frontend (no backend, everything below is client-side)
   ============================================================================ */

/* ---------------------------------------------------------------------------
   1) STATIC CONFIG / DEMO DATA POOLS
   ------------------------------------------------------------------------- */
const CATEGORIES = [
  { id:'startups',    icon:'🚀', name:'Startups',
    color:'#3ED6C4', dim:'rgba(62,214,196,0.14)', line:'rgba(62,214,196,0.4)',
    desc:'Track emerging companies, funding rounds, and product launches.',
    examples:['AI startups','Climate tech startups','Fintech startups','Biotech startups'],
    placeholder:'e.g. AI startups' },
  { id:'research',    icon:'🔬', name:'Research Institutions',
    color:'#9B8CFF', dim:'rgba(155,140,255,0.14)', line:'rgba(155,140,255,0.4)',
    desc:'Follow universities, labs, and research bodies pushing the frontier.',
    examples:['Artificial Intelligence','Quantum Computing','Gene Editing','Robotics'],
    placeholder:'e.g. Artificial Intelligence' },
  { id:'trends',      icon:'📈', name:'Research Trends',
    color:'#5B9DFF', dim:'rgba(91,157,255,0.14)', line:'rgba(91,157,255,0.4)',
    desc:'Spot emerging and fast-growing directions across a field.',
    examples:['Generative AI','Green Hydrogen','Autonomous Vehicles','Synthetic Biology'],
    placeholder:'e.g. Generative AI' },
  { id:'patents',     icon:'📜', name:'Patent Developments',
    color:'#F5A623', dim:'rgba(245,166,35,0.14)', line:'rgba(245,166,35,0.4)',
    desc:'Monitor new filings, grants, and IP movement.',
    examples:['AI healthcare','Battery technology','5G/6G networks','Computer vision'],
    placeholder:'e.g. AI healthcare' },
  { id:'competitors', icon:'🏢', name:'Competitor Strategies',
    color:'#F0637C', dim:'rgba(240,99,124,0.14)', line:'rgba(240,99,124,0.4)',
    desc:"Watch a specific company's moves, hires, and announcements.",
    examples:['OpenAI','Tesla','NVIDIA','Moderna'],
    placeholder:'e.g. a specific company' },
  { id:'news',        icon:'📰', name:'Industry News',
    color:'#4CD787', dim:'rgba(76,215,135,0.14)', line:'rgba(76,215,135,0.4)',
    desc:'Stay on top of headlines shaping an entire industry.',
    examples:['Semiconductor industry','Renewable energy','Cybersecurity','E-commerce'],
    placeholder:'e.g. semiconductor industry' },
];

const IMPORTANCE_LEVELS = ['Low','Medium','High','Critical'];
const IMPORTANCE_WEIGHTS = ['Medium','Medium','High','High','Critical','Low']; // weighted pool

const SOURCES = {
  research:   ['Nature','Science','arXiv','MIT Technology Review','IEEE Spectrum','Nature Communications'],
  patents:    ['USPTO Gazette','Google Patents','WIPO PatentScope','EPO Register'],
  competitor: ['Bloomberg','Reuters','The Information','Business Insider','TechCrunch'],
  news:       ['Reuters','Financial Times','Bloomberg','VentureBeat','TechCrunch'],
  general:    ['TechCrunch','Crunchbase News','PitchBook','VentureBeat','Reuters','Bloomberg'],
};

const TITLE_TEMPLATES = {
  updates: [
    "{topic}: new funding round signals accelerating investor interest",
    "Major player enters the {topic} space with strategic pivot",
    "{topic} sector sees a wave of new product announcements",
    "Analysts flag {topic} as a top area to watch this quarter",
    "New partnership announced around {topic}",
    "{topic} activity accelerates following a recent breakthrough",
    "Hiring surge reported across {topic}",
  ],
  research: [
    "New peer-reviewed study advances {topic} methodology",
    "University lab publishes breakthrough findings on {topic}",
    "Research consortium releases open dataset for {topic}",
    "{topic}: preprint suggests a notable leap in performance",
    "Joint research initiative launched to explore {topic}",
    "Graduate lab reports reproducible gains in {topic}",
  ],
  patents: [
    "New patent filed covering a core {topic} technique",
    "Patent granted for a novel approach to {topic}",
    "{topic}: IP filing activity up sharply this quarter",
    "Company secures broad patent protection in {topic}",
    "Patent dispute emerges over {topic} technology",
    "Continuation patent extends prior {topic} claims",
  ],
  competitor: [
    "{topic} announces a new strategic initiative",
    "{topic} expands into an adjacent market",
    "Leadership change reported at {topic}",
    "{topic} unveils an updated product roadmap",
    "{topic} reportedly in talks for a new partnership",
    "{topic} raises pricing amid rising demand",
  ],
  news: [
    "{topic}: industry-wide shift signals changing dynamics",
    "Regulators turn attention to {topic}",
    "Supply chain developments affect {topic}",
    "{topic} sees a record quarter amid market shifts",
    "Experts weigh in on the future of {topic}",
    "New standards proposal could reshape {topic}",
  ],
};

const SUMMARY_TEMPLATES = [
  "Early signals suggest this could reshape how organizations approach {topic} over the next two to three quarters.",
  "The development adds to a growing body of activity around {topic}, with multiple stakeholders now involved.",
  "Industry watchers note this is one of the more significant moves in {topic} so far this year.",
  "Details remain limited, but the direction points to accelerating momentum in {topic}.",
  "This follows a string of related announcements, reinforcing {topic} as a priority area.",
  "The move is expected to influence how competitors position themselves around {topic}.",
];

const TREND_PHRASES = [
  "Rising investment in {topic}",
  "Consolidation among {topic} players",
  "Shift toward open-source approaches in {topic}",
  "Increased regulatory scrutiny of {topic}",
  "Growing talent migration into {topic}",
  "Cross-industry adoption of {topic}",
];

const ORG_POOL = [
  "Helion Dynamics","Northwind Labs","Vertex Bio","Solace AI","Meridian Robotics",
  "Ionic Materials","Cascade Health","Arclight Systems","Delta Quantum","Brightline Energy",
  "Fathom Research","Cobalt Ventures","Anchorpoint Labs","Kepler Systems","Wavefront AI"
];

const ORG_NOTES = [
  "expanding R&D investment in {topic}",
  "recently filed IP related to {topic}",
  "publicly named as a fast-moving player in {topic}",
  "hiring aggressively in {topic}-adjacent roles",
  "cited across multiple recent reports on {topic}",
];

/* ---------------------------------------------------------------------------
   2) SMALL UTILITIES
   ------------------------------------------------------------------------- */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickN(arr, n){
  const copy = [...arr];
  const out = [];
  n = Math.min(n, copy.length);
  for(let i=0;i<n;i++){ out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]); }
  return out;
}
function fill(tpl, topic){ return tpl.split('{topic}').join(topic); }
function randomRecentDate(maxDaysAgo){
  const days = Math.floor(Math.random()*maxDaysAgo);
  const d = new Date(2026,7,22); // Aug 22 2026
  d.setDate(d.getDate()-days);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function importanceBars(level){
  const idx = IMPORTANCE_LEVELS.indexOf(level)+1; // 1..4
  return idx;
}
function importanceColor(level){
  return { Low:'#5A6674', Medium:'#5B9DFF', High:'#F5A623', Critical:'#F0637C' }[level];
}
function catById(id){ return CATEGORIES.find(c=>c.id===id); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------------------------------------------------------------------
   3) DEMO DATA GENERATORS
   ------------------------------------------------------------------------- */
function genItems(kind, topic, count, sourcePool){
  const templates = TITLE_TEMPLATES[kind] || TITLE_TEMPLATES.updates;
  const chosenTitles = pickN(templates, Math.min(count, templates.length));
  while(chosenTitles.length < count){ chosenTitles.push(pick(templates)); }
  const subLabel = { updates:'Update', research:'Publication', patents:'Filing', competitor:'Announcement', news:'Report' }[kind] || 'Update';
  return chosenTitles.map(t => ({
    title: fill(t, topic),
    source: pick(sourcePool),
    date: randomRecentDate(28),
    label: subLabel,
    importance: pick(IMPORTANCE_WEIGHTS),
    summary: fill(pick(SUMMARY_TEMPLATES), topic),
  })).sort((a,b)=> IMPORTANCE_LEVELS.indexOf(b.importance)-IMPORTANCE_LEVELS.indexOf(a.importance));
}

function genTrends(topic){
  return pickN(TREND_PHRASES, 5).map(t => ({
    name: fill(t, topic),
    value: 35 + Math.floor(Math.random()*60),
  })).sort((a,b)=>b.value-a.value);
}

function genRecommendedActions(category, topic){
  const generic = [
    `Set up a weekly monitoring cadence for ${topic} to catch developments early.`,
    `Brief leadership on the top three ${topic} signals from this scan.`,
    `Identify which organizations tracked under ${topic} are worth a deeper competitive review.`,
    `Flag any patent activity in ${topic} that may affect your product roadmap.`,
    `Share this report with the team responsible for ${topic} strategy.`,
  ];
  return pickN(generic, 4);
}

function buildDemoData(category, topic){
  return {
    updates: genItems('updates', topic, 5, SOURCES.general),
    research: genItems('research', topic, 4, SOURCES.research),
    patents: genItems('patents', topic, 4, SOURCES.patents),
    competitor: genItems('competitor', topic, 4, SOURCES.competitor),
    news: genItems('news', topic, 4, SOURCES.news),
    trends: genTrends(topic),
    recommendedActions: genRecommendedActions(category, topic),
  };
}

function genQuickInsight(category, topic, data){
  const top = data.updates[0];
  return {
    whatHappened: top ? top.title : `New activity detected around ${topic}.`,
    whyMatters: `This is one of several recent signals suggesting ${topic} is moving faster than expected, which changes the window your team has to respond.`,
    potentialImpact: `Could shift competitive positioning around ${topic} within the next one to two quarters.`,
    recommendedAction: `Review the top updates below and decide whether ${topic} warrants a deeper investigation this week.`,
  };
}

/* ---------------------------------------------------------------------------
   4) AI INTELLIGENCE REPORT — two-agent simulated workflow
   ------------------------------------------------------------------------- */
function buildAIReport(category, topic, data){
  const memory = getMemoryContext();
  const orgs = pickN(ORG_POOL, 4).map(name => ({
    name,
    note: fill(pick(ORG_NOTES), topic),
  }));

  const impactLevel = pick(['High','High','Critical','Medium']);
  const impactReasons = {
    Low: `Activity around ${topic} is real but currently isolated, with limited signs of near-term disruption.`,
    Medium: `Multiple independent signals around ${topic} point in the same direction, but no single event changes the competitive picture on its own.`,
    High: `Several research, patent, and competitor signals around ${topic} are reinforcing each other within a short window, suggesting the pace of change is picking up.`,
    Critical: `A cluster of high-importance events around ${topic} arrived in close succession, including credible competitor and IP activity — this combination is unusual and worth immediate attention.`,
  };

  const keyDevelopments = [
    ...data.updates.slice(0,2).map(u=>u.title),
    ...data.research.slice(0,1).map(u=>u.title),
    ...data.patents.slice(0,1).map(u=>u.title),
  ];

  const trendAnalysis = data.trends.slice(0,4).map(t => `${t.name} (signal strength ${t.value}/100)`);

  const opportunities = [
    `Move early on ${topic} while competitor activity is still fragmented rather than consolidated.`,
    `Use the research signals identified above to inform your own ${topic} roadmap before they become public consensus.`,
    `Explore partnerships with the organizations flagged as active in ${topic}.`,
  ];

  const risks = [
    `A well-funded competitor could consolidate ${topic} faster than your team can respond.`,
    `Patent activity in ${topic} may narrow the freedom-to-operate for related product ideas.`,
    `If ${topic} attracts regulatory attention, timelines for related initiatives could slip.`,
  ];

  const recommendedActions = pickN([
    `Assign an owner to track ${topic} weekly using this dashboard.`,
    `Schedule a briefing with product and legal on the patent activity around ${topic}.`,
    `Reach out to one of the flagged organizations to explore a partnership around ${topic}.`,
    `Prepare a competitive response memo in case ${topic} activity accelerates further.`,
    `Re-run this scan in two weeks to confirm whether ${topic} momentum is continuing or cooling.`,
  ], 4);

  const whyCare = `If you work in or around ${topic}, the combination of research momentum, IP activity, and competitor movement identified in this scan means the landscape could look noticeably different within a quarter or two. Acting on early signals now is cheaper than reacting after the market has consolidated.`;

  const whatNext = [
    `Expect at least one more competitor announcement related to ${topic} within 30–45 days.`,
    `Patent filing volume in ${topic} likely continues at a similar or higher pace.`,
    `A consolidation event (acquisition or major partnership) in ${topic} is plausible but not yet confirmed by current signals.`,
  ];

  const execSummary = `Recent activity around ${topic} shows a convergence of research progress, IP filings, and competitor moves within a short window. ${data.updates.length + data.research.length + data.patents.length + data.competitor.length} tracked items across research, patents, competitors, and news suggest momentum is building faster than baseline. The strongest signal is ${(data.updates[0]||{}).title || 'the latest update in the feed'}, reinforced by related research and filing activity. Overall impact is assessed as ${impactLevel.toLowerCase()}, driven primarily by how closely these signals cluster in time. The recommended next step is to prioritize the actions below rather than treat every item as equally urgent.`;

  const memorySummary = memory.longTerm.length
    ? 'The report also considered saved user context: ' + memory.longTerm.slice(0,5).join(' | ') + '.'
    : 'No long-term user memory was available for this scan.';

  return {
    memoryContext: memory,
    memorySummary,
    execSummary,
    keyDevelopments,
    trendAnalysis,
    orgs,
    impact:{ level: impactLevel, reason: impactReasons[impactLevel] },
    opportunities,
    risks,
    recommendedActions,
    whyCare,
    whatNext,
  };
}

/* ---------------------------------------------------------------------------
   4.5) CONTEXT & MEMORY LAYER — browser-persistent
   ------------------------------------------------------------------------- */
let shortMemory = JSON.parse(localStorage.getItem('intelAgent.shortMemory') || '[]');
let longMemory = JSON.parse(localStorage.getItem('intelAgent.longMemory') || '[]');

function persistMemory(){
  localStorage.setItem('intelAgent.shortMemory', JSON.stringify(shortMemory));
  localStorage.setItem('intelAgent.longMemory', JSON.stringify(longMemory));
}

function addShortMemory(text){
  const item = { text:String(text), time:new Date().toLocaleString() };
  shortMemory.unshift(item);
  shortMemory = shortMemory.slice(0, 8);
  persistMemory();
}

function saveLongMemory(text){
  const clean = String(text || '').trim();
  if(!clean) return false;
  longMemory.unshift({text:clean, time:new Date().toLocaleString()});
  longMemory = longMemory.slice(0, 50);
  persistMemory();
  addShortMemory('Saved long-term memory: ' + clean);
  return true;
}

function clearAllMemory(){
  shortMemory = [];
  longMemory = [];
  localStorage.removeItem('intelAgent.shortMemory');
  localStorage.removeItem('intelAgent.longMemory');
}

function getMemoryContext(){
  return {
    shortTerm: shortMemory.slice(0,8).map(x=>x.text),
    longTerm: longMemory.slice(0,20).map(x=>x.text)
  };
}

function seedMemoryIfEmpty(){
  if(shortMemory.length === 0){
    addShortMemory('IntelAgent memory initialized.');
  }
}

function memoryItemsHtml(items){
  if(!items.length) return '<div class="memory-empty">No memory stored yet.</div>';
  return items.map(item => `
    <div class="memory-item">
      <div class="memory-item-text">${escapeHtml(item.text)}</div>
      <div class="memory-item-time">${escapeHtml(item.time)}</div>
    </div>
  `).join('');
}

function ViewMemory(){
  const cat = catById(state.activeCategoryId);
  const ctx = getMemoryContext();
  return `
  <div class="section" style="padding-top:36px;">
    <div class="container memory-shell">
      <button class="back-link" data-action="home">← Back to dashboard</button>
      <div class="section-head">
        <div>
          <div class="section-eyebrow">Persistent context</div>
          <h1 class="section-title">🧠 Context & Memory</h1>
          <p class="section-desc">Memory is stored in this browser with localStorage and automatically reused by future scans in this prototype.</p>
        </div>
        <span class="memory-badge">● Memory Active</span>
      </div>

      <div class="memory-grid">
        <div class="memory-card">
          <div class="panel-title">Current Context</div>
          <div class="memory-context">
            <div class="memory-context-row">
              <span class="memory-key">Category</span>
              <span class="memory-value">${escapeHtml(cat ? cat.name : 'Not selected')}</span>
            </div>
            <div class="memory-context-row">
              <span class="memory-key">Topic</span>
              <span class="memory-value">${escapeHtml(state.topic || 'No active topic')}</span>
            </div>
            <div class="memory-context-row">
              <span class="memory-key">Last Action</span>
              <span class="memory-value">${escapeHtml(state.lastAction || 'None')}</span>
            </div>
            <div class="memory-context-row">
              <span class="memory-key">Long-Term Items</span>
              <span class="memory-value">${longMemory.length}</span>
            </div>
          </div>
        </div>

        <div class="memory-card">
          <div class="panel-title">Save Long-Term Memory</div>
          <p class="section-desc" style="margin:0 0 14px;">Save preferences, project requirements, or other information you want IntelAgent to reuse.</p>
          <div class="memory-input-row">
            <input id="memory-input" class="input" type="text" placeholder="Example: Focus on AI research opportunities"/>
            <button class="btn btn-primary" data-action="save-memory">Save</button>
          </div>
          <div class="memory-actions">
            <button class="btn btn-ghost btn-sm" data-action="clear-memory">Clear all memory</button>
          </div>
        </div>

        <div class="memory-card">
          <div class="panel-title">⚡ Short-Term Memory</div>
          <p class="section-desc" style="margin:0 0 14px;">Recent actions automatically recorded by IntelAgent.</p>
          <div class="memory-list">${memoryItemsHtml(shortMemory)}</div>
        </div>

        <div class="memory-card">
          <div class="panel-title">💡 Long-Term Memory</div>
          <p class="section-desc" style="margin:0 0 14px;">Saved information that can be included as context in future scans.</p>
          <div class="memory-list">${memoryItemsHtml(longMemory)}</div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------------
   5) APP STATE
   ------------------------------------------------------------------------- */
const state = {
  view: 'home',            // 'home' | 'topic' | 'dashboard'
  activeCategoryId: null,
  topic: '',
  chipTopic: '',
  demoData: null,
  aiStatus: 'idle',        // 'idle' | 'running' | 'done'
  aiReport: null,
  aiLogLines: [],
  activeTab: 'overview',
  lastAction: 'None',
};

function goHome(){
  state.lastAction = 'Returned to Dashboard';
  addShortMemory('Returned to Dashboard');
  state.view = 'home';
  render();
  window.scrollTo({top:0, behavior:'instant'});
}
function openCategory(id){
  const cat = catById(id);
  state.lastAction = 'Selected category: ' + (cat ? cat.name : id);
  addShortMemory(state.lastAction);
  state.view = 'topic';
  state.activeCategoryId = id;
  state.topic = '';
  state.chipTopic = '';
  render();
  window.scrollTo({top:0, behavior:'instant'});
}
function startScan(topic){
  const t = (topic || '').trim();
  if(!t){ toast('Enter a topic to monitor before starting a scan.', 'error'); return; }
  state.topic = t;
  const cat = catById(state.activeCategoryId);
  state.lastAction = 'Intelligence Scan: ' + t;
  addShortMemory('Scanned "' + t + '" under ' + (cat ? cat.name : 'Unknown category'));
  state.demoData = buildDemoData(state.activeCategoryId, t);
  state.aiStatus = 'idle';
  state.aiReport = null;
  state.aiLogLines = [];
  state.activeTab = 'overview';
  state.view = 'dashboard';
  render();
  window.scrollTo({top:0, behavior:'instant'});
}

let toastTimer = null;
function toast(msg, kind){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + (kind||'success');
  el.innerHTML = (kind==='error' ? '⚠️ ' : '✅ ') + escapeHtml(msg);
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.remove(), 3200);
}

/* ---------------------------------------------------------------------------
   6) AI ANALYSIS WORKFLOW (mocked two-agent collaboration)
   ------------------------------------------------------------------------- */
const AGENT_STAGES = (topic) => ([
  { cls:'agent1', text:`🔬 Research & Patent Intelligence Agent — scanning research papers and patent filings for "${topic}"...` },
  { cls:'agent1', text:`🔬 Research & Patent Intelligence Agent — extracted key findings, technologies, and inventors.` },
  { cls:'sys',    text:`📡 Forwarding research & patent findings to Competitor & News Intelligence Agent...` },
  { cls:'agent2', text:`🏢 Competitor & News Intelligence Agent — cross-referencing with competitor activity and industry news...` },
  { cls:'agent2', text:`🏢 Competitor & News Intelligence Agent — identified connections, opportunities, and risks.` },
  { cls:'sys',    text:`🧠 Synthesizing combined intelligence report...` },
]);

function runAIAnalysis(){
  if(state.aiStatus === 'running') return;
  state.lastAction = 'AI analysis started for: ' + state.topic;
  addShortMemory(state.lastAction);
  state.aiStatus = 'running';
  state.aiLogLines = [];
  state.aiReport = null;
  render();

  const stages = AGENT_STAGES(state.topic);
  let i = 0;
  const step = () => {
    if(i < stages.length){
      state.aiLogLines.push(stages[i]);
      i++;
      renderAgentLogOnly();
      setTimeout(step, 620);
    } else {
      try{
        state.aiReport = buildAIReport(state.activeCategoryId, state.topic, state.demoData);
        state.aiStatus = 'done';
        render();
        toast('AI Intelligence Report generated successfully.', 'success');
      }catch(e){
        state.aiStatus = 'idle';
        render();
        toast('Something went wrong generating the report. Please try again.', 'error');
      }
    }
  };
  setTimeout(step, 300);
}

function renderAgentLogOnly(){
  const logEl = document.getElementById('agent-log');
  if(!logEl) return;
  logEl.innerHTML = state.aiLogLines.map((l,idx)=>
    `<div class="line ${l.cls}" style="animation-delay:${idx*0.02}s">${escapeHtml(l.text)}</div>`
  ).join('') + (state.aiStatus==='running' ? '<span class="caret"></span>' : '');
  logEl.scrollTop = logEl.scrollHeight;
}

  else if(state.view==='dashboard') body = ViewDashboard();
  else if(state.view==='memory') body = ViewMemory();

  app.innerHTML = `${Nav()}<div style="flex:1;">${body}</div>${Footer()}`;

  if(state.view==='dashboard' && state.activeTab==='ai' && state.aiStatus==='running'){
    renderAgentLogOnly();
  }
}

/* ---------------------------------------------------------------------------
   12) EVENT DELEGATION — every navigation button routes through here
   ------------------------------------------------------------------------- */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case 'home': goHome(); break;

    case 'memory': {
      state.view = 'memory';
      state.lastAction = 'Opened Context & Memory';
      addShortMemory('Opened Context & Memory');
      render();
      window.scrollTo({top:0, behavior:'instant'});
      break;
    }

    case 'save-memory': {
      const input = document.getElementById('memory-input');
      const text = input ? input.value.trim() : '';
      if(!text){
        toast('Enter something to remember.', 'error');
        return;
      }
      saveLongMemory(text);
      state.lastAction = 'Saved long-term memory';
      render();
      toast('Memory saved successfully.', 'success');
      break;
    }

    case 'clear-memory': {
      if(confirm('Clear all IntelAgent memory stored in this browser?')){
        clearAllMemory();
        state.lastAction = 'Cleared all memory';
        render();
        toast('All memory cleared.', 'success');
      }
      break;
    }

    case 'open-category': openCategory(el.dataset.id); break;

    case 'pick-chip': {
      state.chipTopic = el.dataset.topic;
      state.lastAction = 'Selected quick topic: ' + el.dataset.topic;
      addShortMemory(state.lastAction);
      render();
      const input = document.getElementById('topic-input');
      if(input) input.focus();
      break;
    }

    case 'scan-topic': {
      const input = document.getElementById('topic-input');
      startScan(input ? input.value : state.chipTopic);
      break;
    }

    case 'quick-scan': {
      const input = document.getElementById('quick-input');
      const sel = document.getElementById('quick-category');
      state.activeCategoryId = sel ? sel.value : CATEGORIES[0].id;
      startScan(input ? input.value : '');
      break;
    }

    case 'scroll-categories': {
      const sec = document.getElementById('categories-section');
      if(sec) sec.scrollIntoView({behavior:'smooth'});
      break;
    }

    case 'nav-categories': goHome(); setTimeout(()=>{
        const sec = document.getElementById('categories-section');
        if(sec) sec.scrollIntoView({behavior:'smooth'});
      }, 30); break;

    case 'nav-current': {
      if(state.demoData){ state.view='dashboard'; render(); }
      else { toast('Start a scan first to open the Intelligence Dashboard.', 'error'); }
      break;
    }

    case 'nav-about': toast('IntelAgent demo — pick a category, choose a topic, then run the AI Intelligence Report.'); break;
    case 'settings': toast('Settings are not part of this prototype yet.'); break;
    case 'account': toast('Account management is not part of this prototype yet.'); break;

    case 'rescan': {
      state.demoData = buildDemoData(state.activeCategoryId, state.topic);
      state.aiStatus = 'idle';
      state.aiReport = null;
      state.aiLogLines = [];
      render();
      toast('Dashboard refreshed with a new simulated scan.');
      break;
    }

    case 'tab':
      state.activeTab = el.dataset.tab;
      state.lastAction = 'Opened Intelligence tab: ' + el.dataset.tab;
      addShortMemory(state.lastAction);
      render();
      break;

    case 'goto-ai': state.activeTab = 'ai'; render(); break;

    case 'run-ai':
    case 'rerun-ai': runAIAnalysis(); break;
  }
});

/* enter-to-submit on text inputs */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;

  if(e.target.id === 'topic-input'){
    const button = document.querySelector('[data-action="scan-topic"]');
    if(button) button.click();
  }

  if(e.target.id === 'quick-input'){
    const button = document.querySelector('[data-action="quick-scan"]');
    if(button) button.click();
  }

  if(e.target.id === 'memory-input'){
    const button = document.querySelector('[data-action="save-memory"]');
    if(button) button.click();
  }
});

/* ---------------------------------------------------------------------------
   14) INITIALIZE APPLICATION
   ------------------------------------------------------------------------- */
seedMemoryIfEmpty();
render();

</script>
